name: Build & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '发布版本号 (如 v1.1.0)'
        required: true
        default: 'v1.1.0'
      release_title:
        description: 'Release 标题'
        required: true
        default: '取件码助手 正式版发布'
      release_notes:
        description: '本次更新说明 (选填，留空将自动从 CHANGELOG.md 或提交历史提取)'
        required: false
        default: ''
      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        id: prepare_keystore
        run: |
          # 1. 确保 debug.keystore 存在
          if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ] && [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            base64 -d "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/debug.keystore" || true
          fi
          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Generating debug.keystore fallback..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. 准备永久固定的 Release 签名 Keystore (使用仓库持久化的 my-upload-key.jks)
          # 注意：千万不可在每次构建中动态生成临时密钥，否则会导致每次发布的 APK 签名证书不同，用户手机无法覆盖升级安装！
          KEYSTORE_FILE="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ] && [ -f "$GITHUB_WORKSPACE/my-upload-key.jks.base64" ]; then
            echo "Restoring persistent my-upload-key.jks from base64..."
            base64 -d "$GITHUB_WORKSPACE/my-upload-key.jks.base64" > "$KEYSTORE_FILE"
          fi

          # 若用户配置了 GitHub Secrets RELEASE_KEYSTORE_BASE64，则优先采用
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Error: Release keystore file not found!"
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV

      - name: Resolve Version Information
        id: resolve_version
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.version_name }}"
          fi
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.1.0"
          fi

          # 去除首尾空白
          VERSION_TAG=$(echo "$VERSION_TAG" | xargs)

          # 去除前面的 'v' 或 'V' 作为 Android 内部使用的 versionName (如 1.2.0)
          CLEAN_VERSION=$(echo "$VERSION_TAG" | sed 's/^[vV]//')

          # 确保 VERSION_TAG 带有统一的 v 前缀 (例如输入 1.2.0 时标准化为 v1.2.0 用于 GitHub Release Tag 和 APK 文件命名)
          if [[ ! "$VERSION_TAG" =~ ^[vV] ]]; then
            VERSION_TAG="v${VERSION_TAG}"
          fi

          # 计算语义化 versionCode (如 1.2.0 -> 10200)
          IFS='.' read -r -a PARTS <<< "$CLEAN_VERSION"
          MAJOR=$(echo "${PARTS[0]:-1}" | tr -cd '0-9')
          MINOR=$(echo "${PARTS[1]:-0}" | tr -cd '0-9')
          PATCH=$(echo "${PARTS[2]:-0}" | tr -cd '0-9')
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          SEM_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          # 叠加 github.run_number 确保即便同版本重新构建也能递增并支持覆盖安装
          RUN_NUM="${{ github.run_number }}"
          if [ -n "$RUN_NUM" ]; then
            VERSION_CODE=$(( SEM_CODE + RUN_NUM ))
          else
            VERSION_CODE=$SEM_CODE
          fi

          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "app_version_name=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "app_version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "Release Version Tag: $VERSION_TAG"
          echo "Android versionName: $CLEAN_VERSION"
          echo "Android versionCode: $VERSION_CODE"
          echo "=========================================="

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            -PappVersionName="${{ env.APP_VERSION_NAME }}" \
            -PappVersionCode="${{ env.APP_VERSION_CODE }}" \
            --no-daemon --stacktrace

      - name: Package & Prepare Release Artifacts
        id: package_apk
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi

          VERSION_TAG="${{ env.VERSION_TAG }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.1.0"
          fi

          FINAL_APK_NAME="ParcelCode-${VERSION_TAG}-release.apk"
          cp "$APK_FILE" "./$FINAL_APK_NAME"
          echo "Final APK created at: ./$FINAL_APK_NAME"
          echo "apk_path=./$FINAL_APK_NAME" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_apk.outputs.version_tag }}-apk
          path: ${{ steps.package_apk.outputs.apk_path }}
          retention-days: 14

      - name: Generate Release Notes
        id: generate_release_notes
        env:
          CUSTOM_NOTES: ${{ inputs.release_notes }}
          APK_FILE: ${{ steps.package_apk.outputs.apk_path }}
        run: |
          APK_FILE="${{ steps.package_apk.outputs.apk_path }}"
          APK_SIZE=$(du -h "$APK_FILE" | awk '{print $1}')
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')

          export APK_SIZE
          export APK_SHA256

          python3 .github/scripts/generate_release_notes.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package_apk.outputs.version_tag }}
          name: ${{ inputs.release_title || steps.package_apk.outputs.version_tag }}
          body_path: release_body.md
          files: |
            ${{ steps.package_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
